# テスト用URL（anshin-taro-web.kagino-anshin-taro.workers.dev）へのデプロイ。
# 本番ドメインと DNS には触らない。
# リポジトリの Actions secrets に CLOUDFLARE_API_TOKEN が必要。
name: Deploy test site

on:
  push:
    branches:
      - claude/project-thread-kiyam6

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0e3e46a43d38a6b364b91ca4b5c5967e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # D1 のデータベース更新。指紋はテスト用 D1（anshin-taro-web）のもの。
      - run: >-
          npx emdash migrate --from-config --wrangler-config=wrangler.jsonc
          --expected-target-fingerprint=bb4b75e6a77a58a592788c14833593ee7574be0be9ceaf78035e28e1dbbb83d8
      # 記事カテゴリー「鍵業界ニュース」（key-news）を用意する。トップの「ベビちゃんの鍵業界ニュース」はこのカテゴリーの記事を出す（2026-11-15 佐藤さん）。
      # すでにあれば何もしない。言語の値は既存の「Uncategorized」に合わせる。
      - run: >-
          npx wrangler d1 execute anshin-taro-web --remote --command
          "INSERT OR IGNORE INTO taxonomies (id, name, slug, label, locale, translation_group, sort_order)
          SELECT '01M7FXFF88AHVSNVVV0D67R2ZB', 'category', 'key-news', '鍵業界ニュース', locale, '01M7FXFF88AHVSNVVV0D67R2ZB', 4
          FROM taxonomies WHERE name = 'category' AND slug = 'uncategorized' LIMIT 1"
      - run: npx wrangler deploy
